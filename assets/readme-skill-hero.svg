<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">readme-skill</title>
  <desc id="desc">Evidence before prose</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020d20"/>
      <stop offset="1" stop-color="#071a38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48c8ff"/>
      <stop offset="1" stop-color="#8b8cff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".55" stroke="url(#accent)" fill="none" stroke-width="4">
    <rect x="80" y="235" width="250" height="130" rx="18" transform="rotate(-13 80 235)"/>
    <rect x="155" y="460" width="240" height="125" rx="18" transform="rotate(-8 155 460)"/>
    <rect x="55" y="655" width="260" height="125" rx="18" transform="rotate(-10 55 655)"/>
    <path d="M350 300 C510 390 550 420 650 445" stroke-dasharray="10 15"/>
    <path d="M380 520 C510 480 550 470 650 455" stroke-dasharray="10 15"/>
    <path d="M320 710 C500 580 555 515 650 470" stroke-dasharray="10 15"/>
  </g>
  <g fill="#78d9ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" opacity=".8">
    <text x="110" y="295">verified facts</text><text x="110" y="330">repository evidence</text>
    <text x="195" y="520">quality checks</text><text x="105" y="720">clear structure</text>
  </g>
  <g filter="url(#glow)"><path d="M650 450 H1120" stroke="url(#accent)" stroke-width="7"/><path d="m1080 410 60 40-60 40" fill="none" stroke="#48c8ff" stroke-width="9"/></g>
  <g transform="translate(1160 150)"><path d="M0 55 Q0 0 55 0 H300 L385 85 V590 Q385 645 330 645 H55 Q0 645 0 590Z" fill="#f7f9ff"/>
    <path d="M300 0v65q0 20 20 20h65" fill="none" stroke="#d1d9ef" stroke-width="5"/>
    <g fill="#7182e9"><rect x="45" y="145" width="260" height="18" rx="9"/><rect x="45" y="195" width="170" height="12" rx="6" opacity=".55"/><rect x="45" y="275" width="220" height="14" rx="7"/><rect x="45" y="325" width="275" height="12" rx="6" opacity=".5"/><rect x="45" y="375" width="245" height="12" rx="6" opacity=".5"/><rect x="45" y="450" width="180" height="14" rx="7"/><rect x="45" y="500" width="260" height="12" rx="6" opacity=".5"/></g>
    <text x="45" y="115" fill="#7182e9" font-family="ui-monospace, monospace" font-size="52">#</text><text x="45" y="425" fill="#7182e9" font-family="ui-monospace, monospace" font-size="28">&lt;/&gt;</text>
  </g>
  <text x="690" y="390" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="74" font-weight="700">readme-skill</text>
  <text x="730" y="535" fill="#55d7ff" font-family="Inter, Arial, sans-serif" font-size="42">Evidence before prose</text>
  <circle cx="650" cy="450" r="12" fill="#ffffff" filter="url(#glow)"/>
</svg>
